<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Preview of the eden layout for Settings: sidebar, tab bar, two pane cards, status bar. -->
  <rect width="320" height="200" fill="#0a0a0a"/>

  <!-- sidebar: spaces, then agents -->
  <rect x="58.5" width="1" height="200" fill="#202020"/>
  <rect x="8" y="16" width="18" height="3" rx="1.5" fill="#555555"/>
  <rect y="24" width="58" height="10" fill="#202020"/>
  <rect x="8" y="27.5" width="30" height="3" rx="1.5" fill="#d4d4d4"/>
  <rect x="8" y="39.5" width="24" height="3" rx="1.5" fill="#8a8a8a"/>
  <rect x="8" y="51.5" width="34" height="3" rx="1.5" fill="#8a8a8a"/>
  <rect x="8" y="72" width="18" height="3" rx="1.5" fill="#555555"/>
  <rect x="8" y="83" width="4" height="4" fill="#ffffff"/>
  <rect x="16" y="83.5" width="32" height="3" rx="1.5" fill="#ffffff"/>
  <circle cx="10" cy="97" r="2" fill="none" stroke="#d4d4d4"/>
  <rect x="16" y="95.5" width="26" height="3" rx="1.5" fill="#d4d4d4"/>
  <circle cx="10" cy="109" r="1" fill="#555555"/>
  <rect x="16" y="107.5" width="30" height="3" rx="1.5" fill="#8a8a8a"/>

  <!-- tab bar -->
  <rect x="59" y="13.5" width="261" height="1" fill="#202020"/>
  <rect x="63.5" y="3.5" width="44" height="8" rx="2.5" fill="#1a1a1a" stroke="#202020"/>
  <rect x="68" y="6" width="28" height="3" rx="1.5" fill="#d4d4d4"/>
  <rect x="114" y="6" width="22" height="3" rx="1.5" fill="#8a8a8a"/>
  <rect x="144" y="6" width="26" height="3" rx="1.5" fill="#8a8a8a"/>

  <!-- pane cards, each with a header -->
  <g fill="#0f0f0f" stroke="#202020">
    <rect x="62.5" y="17.5" width="152" height="170" rx="3"/>
    <rect x="218.5" y="17.5" width="98" height="170" rx="3" stroke="#555555"/>
  </g>
  <g fill="#202020">
    <rect x="63" y="27.5" width="151" height="1"/>
    <rect x="219" y="27.5" width="97" height="1"/>
  </g>
  <rect x="67" y="21.5" width="20" height="3" rx="1.5" fill="#8a8a8a"/>
  <rect x="223" y="21.5" width="20" height="3" rx="1.5" fill="#d4d4d4"/>
  <g fill="#555555">
    <rect x="68" y="36" width="90" height="2.5" rx="1.25"/>
    <rect x="68" y="43" width="120" height="2.5" rx="1.25"/>
    <rect x="68" y="50" width="70" height="2.5" rx="1.25"/>
    <rect x="68" y="64" width="104" height="2.5" rx="1.25"/>
    <rect x="68" y="71" width="60" height="2.5" rx="1.25"/>
    <rect x="224" y="36" width="70" height="2.5" rx="1.25"/>
    <rect x="224" y="43" width="52" height="2.5" rx="1.25"/>
    <rect x="224" y="50" width="80" height="2.5" rx="1.25"/>
  </g>

  <!-- status bar -->
  <rect x="59" y="190.5" width="261" height="1" fill="#202020"/>
  <rect x="64" y="194" width="16" height="3" rx="1.5" fill="#8a8a8a"/>
  <rect x="86" y="194" width="24" height="3" rx="1.5" fill="#8a8a8a"/>
  <rect x="118" y="194" width="22" height="3" rx="1.5" fill="#d4d4d4"/>
  <rect x="262" y="194" width="14" height="3" rx="1.5" fill="#8a8a8a"/>
  <rect x="282" y="194" width="18" height="3" rx="1.5" fill="#8a8a8a"/>
  <rect x="306" y="194" width="8" height="3" rx="1.5" fill="#555555"/>
