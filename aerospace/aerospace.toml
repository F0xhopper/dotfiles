# ~/.config/aerospace/aerospace.toml
# Docs: https://nikitabobko.github.io/AeroSpace/guide
# Commands: https://nikitabobko.github.io/AeroSpace/commands

# Opt in to the current config semantics (highest version is 2).
config-version = 2

start-at-login = true

# Auto-reload when you :w this file from nvim.
# NOTE: after setting this for the first time, reload once manually
# (alt-shift-semicolon then esc, or `aerospace reload-config`).
auto-reload-config = true

# Start JankyBorders alongside AeroSpace. With no args, `borders` reads
# ~/.config/borders/bordersrc. Don't ALSO run `brew services start borders`
# or you'll get two processes.
after-startup-command = [
    'exec-and-forget borders',
    'exec-and-forget sketchybar',
    'exec-and-forget sketchybar --reload',

]

# Poke sketchybar so it can highlight the newly focused workspace.
exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

# ---------------------------------------------------------------------------
# Layout / tree behaviour
# ---------------------------------------------------------------------------

# i3-style normalizations. Keep these on unless you know why you want them off.
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Padding shown for accordion (i3 "tabbed"/"stacked") layouts.
accordion-padding = 30

default-root-container-layout = 'tiles'
# 'auto' = horizontal split on wide monitors, vertical on tall/portrait ones.
default-root-container-orientation = 'auto'

# Mouse lazily follows the focused monitor (i3 default). Drop if you hate it.
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# cmd-h "hide app" is a menace when you're tiling. This neuters it.
automatically-unhide-macos-hidden-apps = true

focus-follows-mouse.enabled = false

# Keep these workspaces alive even when empty (needs config-version = 2).
persistent-workspaces = ["1", "2", "3", "4", "5"]

# ---------------------------------------------------------------------------
# Gaps — set all to 0 if you want a seamless look; 8 pairs nicely with a 4pt border.
# ---------------------------------------------------------------------------
gaps.inner.horizontal = 3
gaps.inner.vertical   = 3
gaps.outer.left       = 3
gaps.outer.right      = 3
gaps.outer.bottom     = 3
gaps.outer.top        = 3

# ---------------------------------------------------------------------------
# Window rules — put apps where they belong, float the things that shouldn't tile.
# Find bundle IDs with: aerospace list-apps
# ---------------------------------------------------------------------------
on-window-detected = [
    # 1 = terminal (nvim + tmux live here)
    # during-aerospace-startup limits these to sorting windows that already
    # existed when AeroSpace launched. Windows opened afterward (dock,
    # spotlight, alt-b, alt-t, ...) stay on whatever workspace you're on.
    { if = { app-id = 'com.mitchellh.ghostty',   during-aerospace-startup = true }, run = 'move-node-to-workspace 1' },
    { if = { app-id = 'com.github.wez.wezterm',  during-aerospace-startup = true }, run = 'move-node-to-workspace 1' },
    { if = { app-id = 'net.kovidgoyal.kitty',    during-aerospace-startup = true }, run = 'move-node-to-workspace 1' },
    { if = { app-id = 'org.alacritty',           during-aerospace-startup = true }, run = 'move-node-to-workspace 1' },

    # 2 = browser
    { if = { app-id = 'com.google.Chrome',           during-aerospace-startup = true }, run = 'move-node-to-workspace 2' },
    { if = { app-id = 'org.mozilla.firefox',         during-aerospace-startup = true }, run = 'move-node-to-workspace 2' },
    { if = { app-id = 'com.apple.Safari',            during-aerospace-startup = true }, run = 'move-node-to-workspace 2' },
    { if = { app-id = 'company.thebrowser.Browser',  during-aerospace-startup = true }, run = 'move-node-to-workspace 2' },

    # 4 = comms
    { if = { app-id = 'com.tinyspeck.slackmacgap', during-aerospace-startup = true }, run = 'move-node-to-workspace 4' },
    { if = { app-id = 'com.hnc.Discord',           during-aerospace-startup = true }, run = 'move-node-to-workspace 4' },

    # Always float these (not startup-gated: applies to every window, always)
    { if = { app-id = 'com.apple.systempreferences' }, run = 'layout floating' },
    { if = { app-id = 'com.apple.finder' },            run = 'layout floating' },
    { if = { app-id = 'com.apple.ActivityMonitor' },   run = 'layout floating' },
    { if = { app-id = 'com.apple.calculator' },        run = 'layout floating' },
]

# ---------------------------------------------------------------------------
# Keybindings. Modifier is alt (= the Option key).
# ---------------------------------------------------------------------------
[mode.main.binding]

    # --- Launch ---
    # Change Ghostty to whatever you use: wezterm, kitty, Alacritty, iTerm.
    alt-enter = 'exec-and-forget open -na Ghostty'
    alt-t = 'exec-and-forget open -na Ghostty'                                      # new terminal instance
    alt-b = 'exec-and-forget open -na "Google Chrome" --args --new-window'          # new browser window

    # --- Focus (vim keys) ---
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    # --- Move window ---
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # --- Layout ---
    alt-slash = 'layout tiles horizontal vertical'      # toggle split direction
    alt-comma = 'layout accordion horizontal vertical'  # i3 "tabbed" mode
    alt-f     = 'layout floating tiling'                # toggle float on this window
    alt-shift-f = 'macos-native-fullscreen'

    # --- Resize ---
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'
    alt-r     = 'mode resize'          # enter a sticky resize mode
    alt-shift-r = 'flatten-workspace-tree'  # reset a mangled layout

    # --- Close ---
    alt-shift-q = 'close'

    # --- Workspaces ---
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-tab = 'workspace-back-and-forth'

    # Send window to workspace. Append '; workspace N' if you want to follow it.
    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'

    # --- Monitors ---
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # --- Service mode ---
    alt-shift-semicolon = 'mode service'

    # --- Cycle workspaces (like i3's mod+bracket) ---
    alt-rightSquareBracket = 'list-workspaces --monitor focused --empty no | workspace --stdin next'
    alt-leftSquareBracket  = 'list-workspaces --monitor focused --empty no | workspace --stdin prev'
[mode.resize.binding]
    h = 'resize width -50'
    j = 'resize height +50'
    k = 'resize height -50'
    l = 'resize width +50'
    b = 'balance-sizes'
    enter = 'mode main'
    esc = 'mode main'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main']
    f = ['layout floating tiling', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']

    # Merge the focused window into the neighbouring container.
    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']
